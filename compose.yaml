# HotelLink - plataforma completa en contenedores (proyecto integrador InfraWeb HA).
#
#   Levantar:   docker compose up -d --build
#   Estado:     docker compose ps
#   Registros:  docker compose logs -f back
#
# Servicios:
#   back   -> hotellink-back   Laravel 12 (API REST + panel Blade), PHP 8.3 + Apache  :8080
#   web02  -> hotellink-web02  segunda instancia web (misma imagen, alta disponibilidad) :8081
#   base   -> hotellink-base   MariaDB 10.11, SOLO en la red interna (sin puerto publicado)
#   worker -> hotellink-worker cola de tareas (correos) con la misma imagen que back
#   front  -> hotellink-front  portal React (Vite dev server)                         :5173
#
# Red:      hotellink-net (bridge personalizada). Los servicios se localizan por nombre.
# Volumen:  hotellink-dbdata conserva /var/lib/mysql aunque se recreen los contenedores.

name: hotellink

services:

  # ---------------------------------------------------------------- WEB 01
  back:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hotellink-app:1.0
    container_name: hotellink-back
    hostname: hotellink-back
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"          # unico puerto publicado del backend
    networks:
      - hotellink-net
    volumes:
      # Codigo fuente (desarrollo): los cambios se ven sin reconstruir la imagen.
      - .:/var/www/html
      # Configuracion de PHP montada en SOLO LECTURA: el contenedor no puede alterarla.
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/hotellink.ini:ro
    environment:
      HOTELLINK_NODE: web01
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_PORT: "${APP_PORT:-8080}"
      DB_HOST: base                      # nombre del servicio, resuelto por el DNS de Docker
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: "${DOCKER_DB_USER:-hotellink}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-hotellink_dev}"
    depends_on:
      base:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Holgado: la primera vez entrypoint.sh ejecuta composer install sobre el bind mount.
      start_period: 10m

  # ---------------------------------------------------------------- WEB 02
  # Segunda instancia del mismo servicio web (alta disponibilidad).
  # Reutiliza la imagen construida por "back"; no corre migraciones ni seeders.
  web02:
    image: hotellink-app:1.0
    container_name: hotellink-web02
    hostname: hotellink-web02
    restart: unless-stopped
    ports:
      - "${WEB02_PORT:-8081}:80"
    networks:
      - hotellink-net
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/hotellink.ini:ro
    environment:
      HOTELLINK_NODE: web02
      HOTELLINK_ROLE: replica            # el entrypoint solo espera la BD y arranca Apache
      APP_URL: "http://localhost:${WEB02_PORT:-8081}"
      APP_PORT: "${WEB02_PORT:-8081}"
      DB_HOST: base
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: "${DOCKER_DB_USER:-hotellink}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-hotellink_dev}"
    depends_on:
      base:
        condition: service_healthy
      back:
        condition: service_healthy       # web01 ya preparo la base (migraciones/seed)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- BASE DE DATOS
  base:
    image: mariadb:10.11
    container_name: hotellink-base
    hostname: hotellink-base
    restart: unless-stopped
    # Sin "ports": la BD solo es alcanzable desde la red interna hotellink-net.
    networks:
      - hotellink-net
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_dev}"
      MARIADB_DATABASE: "${DB_DATABASE:-hotellink}"
      MARIADB_USER: "${DOCKER_DB_USER:-hotellink}"        # usuario de aplicacion, no root
      MARIADB_PASSWORD: "${DOCKER_DB_PASSWORD:-hotellink_dev}"
    volumes:
      - hotellink-dbdata:/var/lib/mysql  # volumen nombrado: persistencia de datos
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- WORKER
  worker:
    image: hotellink-app:1.0
    container_name: hotellink-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=90
    networks:
      - hotellink-net
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/hotellink.ini:ro
    environment:
      HOTELLINK_NODE: worker
      DB_HOST: base
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: "${DOCKER_DB_USER:-hotellink}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-hotellink_dev}"
    depends_on:
      base:
        condition: service_healthy
      back:
        condition: service_healthy

  # ---------------------------------------------------------------- FRONT (React)
  front:
    image: node:22-alpine
    container_name: hotellink-front
    hostname: hotellink-front
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - hotellink-net
    volumes:
      - ./frontend:/app
      - hotellink-node-modules:/app/node_modules   # evita que el bind mount de Windows pise node_modules
    depends_on:
      back:
        condition: service_healthy

networks:
  hotellink-net:
    name: hotellink-net
    driver: bridge

volumes:
  hotellink-dbdata:
    name: hotellink-dbdata
  hotellink-node-modules:
    name: hotellink-node-modules
