# HotelLink - entorno completo en contenedores.
# Levantar con:  docker compose up -d --build
# Ver avance:    docker compose logs -f back
#
# Servicios:
#   back   -> Laravel (API + sitio Blade), PHP 8.3 + Apache
#   front  -> React (Vite dev server)
#   base   -> MariaDB (base de datos)
#   worker -> procesa tareas en segundo plano (correos)

services:
  # BACK: Laravel (API + Blade). PHP 8.3 + Apache sirviendo desde public/
  back:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hotellink-app
    container_name: hotellink-back
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # El codigo se monta para que los cambios se vean sin reconstruir.
      - .:/var/www/html
    environment:
      # Overrides validos SOLO dentro de los contenedores (no tocan tu XAMPP).
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_PORT: "${APP_PORT:-8080}"
      DB_HOST: base
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      # Correo: se toma del .env (SMTP real)
    depends_on:
      base:
        condition: service_healthy

  # BASE: MariaDB (mismo motor que trae XAMPP).
  base:
    image: mariadb:10.11
    container_name: hotellink-base
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${DB_DATABASE:-hotellink}"
    ports:
      # Para conectarte con un cliente externo (DBeaver, HeidiSQL) en 127.0.0.1
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # WORKER: procesa los correos en segundo plano (QUEUE_CONNECTION=database).
  # Reutiliza la MISMA imagen que "back" (no construye otra).
  worker:
    image: hotellink-app
    container_name: hotellink-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=90
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: base
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      # Correo: se toma del .env (SMTP real)
    depends_on:
      base:
        condition: service_healthy
      back:
        condition: service_started

  # FRONT: React (Vite dev server). Corre en Node dentro de Docker.
  front:
    image: node:22-alpine
    container_name: hotellink-front
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Volumen propio para node_modules (que el bind-mount de Windows no lo pise)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - back

volumes:
  dbdata:
  frontend_node_modules:
