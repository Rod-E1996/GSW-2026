# HotelLink - entorno completo en contenedores.
# Levantar con:  docker compose up -d --build
# Ver avance:    docker compose logs -f app

services:
  # Aplicacion: PHP 8.3 + Apache sirviendo Laravel desde public/
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # El codigo se monta para que los cambios se vean sin reconstruir.
      - .:/var/www/html
    environment:
      # Overrides validos SOLO dentro de los contenedores (no tocan tu XAMPP).
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_PORT: "${APP_PORT:-8080}"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy

  # Base de datos: MariaDB (mismo motor que trae XAMPP).
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${DB_DATABASE:-hotellink}"
    ports:
      # Para conectarte con un cliente externo (DBeaver, HeidiSQL) en 127.0.0.1
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Procesa los correos en segundo plano (QUEUE_CONNECTION=database).
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=90
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-hotellink}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  # Administrador visual de la base de datos.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      UPLOAD_LIMIT: 50M
    depends_on:
      db:
        condition: service_healthy

  # Buzon de correo de prueba: captura los correos sin enviarlos a internet.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  dbdata:
