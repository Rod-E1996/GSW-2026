<VirtualHost *:80>
    ServerName hotellink.local
    # Laravel se sirve desde la carpeta public/
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos subidos (imagenes de habitaciones). Se sirve por Alias y no por el
    # enlace simbolico public/storage, que en un bind mount de Windows apunta a una
    # ruta del host que no existe dentro del contenedor (error AH00037 / HTTP 403).
    Alias /storage /var/www/html/storage/app/public
    <Directory /var/www/html/storage/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
