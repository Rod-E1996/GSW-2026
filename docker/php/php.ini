; Ajustes de PHP para HotelLink (subida de imágenes de habitaciones, etc.)
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120

; --- OPcache: cachea el bytecode PHP ya compilado en memoria ---
; Clave con el bind mount de Windows: sin esto PHP recompila cientos de
; archivos en CADA peticion (de ahi los ~22s). Con esto, tras calentar,
; las peticiones siguientes no vuelven a compilar.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=1 + revalidate_freq=2: tus cambios de codigo siguen
; viendose (como mucho 2s despues), sin revisar el mtime en cada peticion.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
